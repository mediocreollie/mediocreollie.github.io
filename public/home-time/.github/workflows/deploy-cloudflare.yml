name: Deploy Get Me Home

on:
  push:
    branches: [main]
    paths:
      - "public/home-time/**"
      - "public/home-time/.github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: public/home-time

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: public/home-time/package-lock.json

      - name: Install, test, and build
        run: |
          npm ci
          npm test
          npm run build

      - name: Deploy the app
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: public/home-time
          command: deploy --config dist/server/wrangler.json
