name: Diagnose Woolworths API
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/cocobella/diagnose_woolworths.py'
      - '.github/workflows/diagnose-woolworths.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/cocobella/diagnose_woolworths.py
