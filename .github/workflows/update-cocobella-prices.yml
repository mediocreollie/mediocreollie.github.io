name: Update Cocobella prices

on:
  schedule:
    # 20:15 UTC is 05:45 Adelaide standard time, 06:45 during daylight saving.
    - cron: '15 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COCOBELLA_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser for Woolworths
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Collect and update price data
        run: python scripts/cocobella/update_prices.py

      - name: Validate tracker tests
        run: python -m unittest discover -s tests/cocobella -p 'test_*.py'

      - name: Commit and push updated Cocobella data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cocobella/data
          git diff --cached --quiet || git commit -m "Update Cocobella prices"
          git push
