name: Wine Journal V2 Source Checks
on:
  pull_request:
    paths:
      - 'public/wine-journal/**'
      - 'supabase/wine-journal-v2-*.sql'
      - 'tests/wine-journal-v2.test.mjs'
      - '.github/workflows/wine-journal-v2.yml'
  workflow_dispatch:

jobs:
  v2-source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate V2 code and RLS guardrails
        run: node --test tests/wine-journal-v2.test.mjs
